[package]
name = "proj-finder"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
log = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
tree-sitter = "0.25"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
